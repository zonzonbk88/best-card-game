<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emberfall Duel</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d2a20; }
  body { display: flex; align-items: center; justify-content: center; }
  #game { display: block; touch-action: none; cursor: pointer; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Emberfall Duel: an original card duel. Play cards with the mouse, chain elements to kindle them, and reduce Warden Vex to zero life."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
